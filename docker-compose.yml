# ==============================================================================
# Default Docker Compose (Development with Neon Local)
# ==============================================================================
# Usage: docker compose up --build
# To run production instead: docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  neon-local:
    image: neondatabase/neon_local:latest
    container_name: acqusition-neon-local
    ports:
      - '5432:5432'
    env_file:
      - .env.development
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      - acqusition-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: acqusition-app-dev
    restart: unless-stopped
    depends_on:
      neon-local:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
      - ./package.json:/app/package.json:ro
      - ./drizzle.config.js:/app/drizzle.config.js:ro
    networks:
      - acqusition-net

networks:
  acqusition-net:
    driver: bridge
